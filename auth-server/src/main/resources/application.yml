server:
  port: 9000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/oauth2_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

login-server:
  url: http://localhost:8081

logging:
  level:
    org.springframework.security: DEBUG
